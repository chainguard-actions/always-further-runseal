name: Test filesystem write access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install fake runseal and nono to bypass download and Landlock
        run: |
          set -euo pipefail
          RUNSEAL_VERSION="0.3.0"
          NONO_VERSION="0.3.0"
          TARGET="x86_64-unknown-linux-gnu"
          INSTALL_ROOT="${RUNNER_TOOL_CACHE:-/tmp}/runseal"

          NONO_DIR="${INSTALL_ROOT}/nono/${NONO_VERSION}/${TARGET}"
          mkdir -p "$NONO_DIR"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-nono.sh" "$NONO_DIR/nono"
          chmod +x "$NONO_DIR/nono"
          echo "$NONO_DIR" >> "$GITHUB_PATH"

          RUNSEAL_DIR="${INSTALL_ROOT}/runseal/${RUNSEAL_VERSION}/${TARGET}"
          mkdir -p "$RUNSEAL_DIR"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-runseal.sh" "$RUNSEAL_DIR/runseal"
          chmod +x "$RUNSEAL_DIR/runseal"
          echo "$RUNSEAL_DIR" >> "$GITHUB_PATH"

          echo "Fake nono installed at $NONO_DIR/nono"
          echo "Fake runseal installed at $RUNSEAL_DIR/runseal"

      - name: Prepare output directory
        run: |
          mkdir -p /tmp/runseal-write-test

      - name: Run command with fs-write permission
        id: action
        uses: .
        with:
          run: echo "written-by-runseal" > /tmp/runseal-write-test/output.txt
          fs-write: "/tmp/runseal-write-test"
          network: blocked
          runseal-version: "0.3.0"
          nono-version: "0.3.0"
          verify-attestations: "false"

      - name: Assert output file was written
        run: |
          if [ ! -f /tmp/runseal-write-test/output.txt ]; then
            echo "FAIL: output file was not created"
            exit 1
          fi
          CONTENT="$(cat /tmp/runseal-write-test/output.txt)"
          echo "content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "written-by-runseal"; then
            echo "FAIL: expected 'written-by-runseal' in output file"
            exit 1
          fi
          echo "PASS: fs-write test completed successfully"
