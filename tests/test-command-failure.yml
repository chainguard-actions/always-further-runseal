name: Test failing command propagates failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          verify-attestations: "false"
          run: exit 3
          policy: |
            fs:
              read: ["."]
              write: []
            network:
              mode: blocked
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when sandboxed command exits non-zero"
            exit 1
          fi
          echo "PASS"
