name: Test profile and policy are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare
        run: |
          rm -f "$GITHUB_WORKSPACE/conflict-marker.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          verify-attestations: "false"
          profile: tests/fixtures/runseal.json
          run: echo should-not-run > conflict-marker.txt
          policy: |
            fs:
              read: ["."]
              write: ["."]
            network:
              mode: blocked
      - name: Assert rejected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both profile and policy are set"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/conflict-marker.txt" ]; then
            echo "FAIL: command ran despite conflicting configuration"
            exit 1
          fi
          echo "PASS"
