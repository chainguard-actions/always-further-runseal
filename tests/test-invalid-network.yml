name: Test network=filtered is rejected outside policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare
        run: |
          rm -rf "$GITHUB_WORKSPACE/net-out"
          mkdir -p "$GITHUB_WORKSPACE/net-out"
      - id: action
        uses: .
        continue-on-error: true
        with:
          verify-attestations: "false"
          fs-read: "."
          fs-write: "./net-out"
          network: filtered
          run: echo should-not-run > net-out/marker.txt
      - name: Assert rejected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected 'filtered' network input to be rejected"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/net-out/marker.txt" ]; then
            echo "FAIL: command ran despite invalid network input"
            exit 1
          fi
          echo "PASS"
