name: Test filesystem read access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install fake runseal and nono to bypass download and Landlock
        run: |
          set -euo pipefail
          RUNSEAL_VERSION="0.3.0"
          NONO_VERSION="0.3.0"
          TARGET="x86_64-unknown-linux-gnu"
          INSTALL_ROOT="${RUNNER_TOOL_CACHE:-/tmp}/runseal"

          NONO_DIR="${INSTALL_ROOT}/nono/${NONO_VERSION}/${TARGET}"
          mkdir -p "$NONO_DIR"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-nono.sh" "$NONO_DIR/nono"
          chmod +x "$NONO_DIR/nono"
          echo "$NONO_DIR" >> "$GITHUB_PATH"

          RUNSEAL_DIR="${INSTALL_ROOT}/runseal/${RUNSEAL_VERSION}/${TARGET}"
          mkdir -p "$RUNSEAL_DIR"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-runseal.sh" "$RUNSEAL_DIR/runseal"
          chmod +x "$RUNSEAL_DIR/runseal"
          echo "$RUNSEAL_DIR" >> "$GITHUB_PATH"

          echo "Fake nono installed at $NONO_DIR/nono"
          echo "Fake runseal installed at $RUNSEAL_DIR/runseal"

      - name: Create a test file to read
        run: |
          echo "test-content-12345" > /tmp/test-read-file.txt

      - name: Run command with fs-read permission
        id: action
        uses: .
        with:
          run: cat /tmp/test-read-file.txt
          fs-read: "/tmp/test-read-file.txt"
          network: blocked
          runseal-version: "0.3.0"
          nono-version: "0.3.0"
          verify-attestations: "false"

      - name: Assert action completed successfully
        run: |
          echo "PASS: fs-read test completed without error"
