name: "Runseal - Supply Chain Security Action"
description: "Run commands with sealed credentials, L7 filtering, and nono sandbox enforcement for complete CI supply chain protection"
author: "Always Further"
branding:
  icon: shield
  color: purple

inputs:
  run:
    description: "Command to execute inside the sandbox"
    required: true
  policy:
    description: "Runseal policy YAML"
    required: false
    default: ""
  profile:
    description: "Path to a nono profile committed in the repository, relative to the workspace (for example runseal.json). Mutually exclusive with policy, fs-read, fs-write, and network."
    required: false
    default: ""
  fs-read:
    description: "Comma-separated paths to allow read access when policy is not set"
    required: false
    default: ""
  fs-write:
    description: "Comma-separated paths to allow write access when policy is not set"
    required: false
    default: ""
  network:
    description: "Network policy when policy is not set: blocked or comma-separated domain allowlist. Defaults to blocked when empty."
    required: false
    default: ""
  runseal-version:
    description: "Runseal version to install, without or with leading v"
    required: false
    default: "0.3.4"
  nono-version:
    description: "nono version to install. Defaults to the Dependabot-managed pin."
    required: false
    default: ""
  verify-attestations:
    description: "Verify GitHub artifact attestations for downloaded runseal and nono release assets"
    required: false
    default: "true"
  audit:
    description: "Export nono audit evidence as a GitHub Actions artifact. Set to 'artifact' or 'true' to enable."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Setup Runseal
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
      env:
        RUNSEAL_VERSION: ${{ inputs.runseal-version }}
        NONO_VERSION: ${{ inputs.nono-version }}
        RUNSEAL_VERIFY_ATTESTATIONS: ${{ inputs.verify-attestations }}
        RUNSEAL_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
    - name: Run sealed command
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/run-sealed.sh"
      env:
        RUNSEAL_RUN: ${{ inputs.run }}
        RUNSEAL_POLICY: ${{ inputs.policy }}
        RUNSEAL_PROFILE: ${{ inputs.profile }}
        RUNSEAL_FS_READ: ${{ inputs.fs-read }}
        RUNSEAL_FS_WRITE: ${{ inputs.fs-write }}
        RUNSEAL_NETWORK: ${{ inputs.network }}
        RUNSEAL_AUDIT: ${{ inputs.audit }}
        RUNSEAL_AUDIT_DIR: ${{ runner.temp }}/runseal-audit
    - name: Upload Runseal audit
      if: ${{ always() && (inputs.audit == 'artifact' || inputs.audit == 'true') }}
      uses: chainguard-actions/actions-upload-artifact@7d21b863ba4fc97f698d6c451875ee6cf043953a # v7.0.1
      with:
        name: runseal-audit
        path: ${{ runner.temp }}/runseal-audit
        if-no-files-found: warn
